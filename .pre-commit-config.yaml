# .pre-commit-config.yaml
repos:
  - repo: https://github.com/psf/black
    rev: stable  # Use the specific version of black you want to pin to
    hooks:
      - id: black
        language_version: python3  # Ensure black runs with Python 3

  - repo: https://github.com/pycqa/flake8
    rev: 3.9.2  # Use the specific version of flake8 you want to pin to
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]  # Example: to include additional plugin